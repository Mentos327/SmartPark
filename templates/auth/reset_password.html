{% extends "base.html" %}
{% block title %}Reset Password — smart.park{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-box-header bg-brand">
      <div class="auth-logo"><i class="icon icon-lock"></i></div>
      <h3>Set New Password</h3>
      <p>Enter your new password below</p>
    </div>
    <div class="auth-box-body">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible">
          {{ message }}<button type="button" class="alert-dismiss-btn" aria-label="Close">&times;</button>
        </div>
      {% endfor %}
      <form method="POST">
        <div class="mb-3">
          <label for="password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="icon icon-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="New password" required />
          </div>
        </div>
        <div class="mb-4">
          <label for="confirm" class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="icon icon-lock"></i></span>
            <input type="password" class="form-control" id="confirm" name="confirm_password" placeholder="Repeat password" required />
          </div>
        </div>
        <button type="submit" class="btn btn-danger w-100 py-2 btn-brand">
          <i class="icon icon-check-circle me-2"></i>Reset Password
        </button>
      </form>
    </div>
    <div class="auth-box-footer">
      <a href="{{ url_for('auth.login') }}">&larr; Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
